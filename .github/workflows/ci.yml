name: CAP CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        # Use npm ci after package-lock.json has been generated and committed.
        # The learning repo starts without a lockfile, so npm install is used.
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build production artifacts
        run: npm run build
